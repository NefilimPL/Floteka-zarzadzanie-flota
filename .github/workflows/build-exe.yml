name: Floteka - Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'fleet/**'
      - 'main.py'
      - 'requirements*.txt'
      - 'tools/build_exe.ps1'
      - 'tools/windows-version.txt'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/build-exe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fleet/**'
      - 'main.py'
      - 'requirements*.txt'
      - 'tools/build_exe.ps1'
      - 'tools/windows-version.txt'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/build-exe.yml'

permissions:
  contents: read

concurrency:
  group: floteka-exe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    name: Testy, budowa i sprawdzenie EXE
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Python 3.13 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Zainstaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip update failed.' }
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }

      - name: Testy aplikacji SQLite i GUI
        run: |
          python -m pytest tests --ignore=tests/test_excel_layout.py -q -p no:cacheprovider --junitxml=build/test-results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Application tests failed.' }

      - name: Zbuduj i uruchom gotowy EXE
        run: ./tools/build_exe.ps1 -OutputDirectory dist/actions

      - name: Udostepnij Floteka.exe
        uses: actions/upload-artifact@v7
        with:
          name: Floteka-Windows-x64
          path: |
            dist/actions/Floteka.exe
            dist/actions/INSTRUKCJA.md
            dist/actions/SUMY-SHA256.txt
            dist/actions/exe-test.json
            dist/actions/build-info.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Zachowaj raporty testow i budowy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Floteka-raporty
          path: |
            build/test-results.xml
            build/pyinstaller/Floteka/warn-Floteka.txt
          if-no-files-found: ignore
          retention-days: 14
